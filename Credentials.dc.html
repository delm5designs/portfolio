<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/colors.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/typography.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/shape.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/tokens/motion.css">
  <link rel="stylesheet" href="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/styles.css">
  <script src="_ds/morana-design-system-7dc00243-9061-4778-968a-63ab84ccbd99/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--surface-page, #fbf7ea); }
    a { color: var(--olive-600, #6f7c33); text-decoration: none; }
    a:hover { color: var(--plum-500, #56466b); }
  </style>
</helmet>

<dc-import name="SiteNav" active="credentials" hint-size="100%,80px"></dc-import>

<div style="max-width:1140px;margin:0 auto;padding:64px 5vw 120px;display:flex;flex-direction:column;gap:48px;font-family:Archivo,sans-serif;">

  <x-import component-from-global-scope="MoranaDesignSystem_7dc002.SectionHeading" hint-size="100%,160px"
    eyebrow="Credentials" title="Psychology first, specialisations" accent="after"
    lead="A BA in Psychology and a Master's in Organizational and Social Psychology, with certifications in instructional design, accessibility, mentoring, and behavioural design layered on top.">
  </x-import>

  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="7">
      <button style="{{ f.style }}" onclick="{{ f.onClick }}">{{ f.label }}</button>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:1px;background:var(--border-subtle);border:1px solid var(--border-subtle);">
    <sc-for list="{{ visible }}" as="c" hint-placeholder-count="6">
      <div style="background:var(--surface-card,#fdfbf4);padding:20px 24px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start;">
        <div style="display:flex;flex-direction:column;gap:4px;">
          <div style="font-family:Newsreader,serif;font-size:17px;">{{ c.title }}</div>
          <div style="font-size:13px;color:var(--text-muted,#6b5f72);">{{ c.provider }}</div>
          <p style="margin:4px 0 0;font-size:14px;line-height:1.55;max-width:56ch;">{{ c.desc }}</p>
        </div>
        <div style="font-size:12px;color:var(--olive-600,#6f7c33);white-space:nowrap;">{{ c.date }}</div>
      </div>
    </sc-for>
  </div>

  <p style="font-size:14px;color:var(--text-muted,#6b5f72);margin:0;">Other certifications: a full folder of additional certificates and micro-courses is available on request.</p>

</div>

<dc-import name="SiteFooter" hint-size="100%,180px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTopic: 'All' };

  TOPICS = ['Human-centric learning', 'Accessibility-first', 'Behavioural design & gamification', 'Mentoring & coaching', 'AI-era ways of working', 'Community & youth support models'];

  CREDS = [
    { title: 'Certificate Program in Learning and Development', provider: 'Udemy, Learning and Development Academy', date: 'Jan 2026', desc: 'Instructional design, curriculum development, and L&D program management fundamentals.', tags: ['Human-centric learning'] },
    { title: 'Gamification & Behavioral Design - The Octalysis Framework', provider: 'Udemy (Yu-Kai Chou)', date: 'Dec 2022', desc: 'The 8 Core Drives model and white-hat/black-hat motivation analysis, applied throughout my program designs.', tags: ['Behavioural design & gamification'] },
    { title: 'Digital Accessibility Training for SSU and Learning Contributors', provider: 'SoftServe University', date: 'Apr 2023', desc: 'Accessible learning content design, meeting digital accessibility standards for diverse learners.', tags: ['Accessibility-first'] },
    { title: 'AI Best Practices for People Managers and Team Members', provider: 'Udemy', date: 'Aug 2025', desc: 'Integrating AI tools into people management and team workflows.', tags: ['AI-era ways of working'] },
    { title: 'Be a Great Mentor: A Practical Guide to Mentorship', provider: 'Udemy, NASBA-accredited (2.4 CPE credits)', date: 'Sept 2022', desc: 'Structured mentorship methodology, supporting train-the-trainer and mentor-pairing design work.', tags: ['Mentoring & coaching'] },
    { title: 'Finnish Ohjaamo Methodology Working with Youth', provider: 'Erasmus+ / Elektrėnų kultūros centras, Palanga, Lithuania', date: 'Sept 2025', desc: 'Six-day cross-national training on the Finnish "one-stop-shop" service model.', tags: ['Community & youth support models'] },
  ];

  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    const topic = params.get('topic');
    if (topic && this.TOPICS.includes(topic)) this.setState({ activeTopic: topic });
  }

  chipStyle(active) {
    const base = 'font-family:Archivo,sans-serif;font-size:13px;padding:8px 16px;border-radius:2px;cursor:pointer;background:transparent;';
    return active
      ? base + 'border:1px solid var(--olive-600,#6f7c33);background:var(--accent-quiet,rgba(111,124,51,.12));color:var(--olive-600,#6f7c33);'
      : base + 'border:1px solid var(--border-subtle);color:var(--text-body,#4a3f50);';
  }

  renderVals() {
    const s = this.state;
    const filters = ['All', ...this.TOPICS].map(t => ({
      label: t, style: this.chipStyle(s.activeTopic === t),
      onClick: () => this.setState({ activeTopic: t }),
    }));
    const visible = s.activeTopic === 'All' ? this.CREDS : this.CREDS.filter(c => c.tags.includes(s.activeTopic));
    return { filters, visible };
  }
}

</script>
</body>
</html>
