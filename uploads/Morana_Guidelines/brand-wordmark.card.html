<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:150px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:flex;gap:40px;align-items:center;flex-wrap:wrap}.w{font-family:var(--font-display);font-weight:500;font-size:22px;letter-spacing:var(--tracking-wordmark);text-transform:uppercase;color:var(--text-strong)}.inv{background:var(--surface-inverse);color:var(--text-on-dark);padding:10px 16px;border-radius:var(--radius-sm)}.k{font-size:10.5px;color:var(--text-muted);margin-top:8px}</style></head><body><div class="row"><div><div class="w">Morana</div><div class="k">EN · --tracking-wordmark</div></div><div><div class="w">Морана</div><div class="k">BG · Cyrillic</div></div><div><div class="w inv">Morana</div><div class="k">on inverse</div></div></div><div class="mono" style="margin-top:12px">Newsreader 500 · uppercase · 0.24em - never set in Archivo</div></body></html>
