<!-- @dsCard group="Motion" viewport="700x190" name="The ring field" subtitle="Four orbits at 16/26/40/58s in alternating directions, with a ring expanding through them every 7s. Always cropped." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:190px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.stage{position:relative;height:150px;display:grid;place-items:center;overflow:hidden;background:var(--surface-page)}.r{position:absolute;border-radius:50%;border:var(--ring-width) solid;aspect-ratio:1;display:grid;place-items:center}.r1{width:70px;border-color:var(--ring-1);animation:spin var(--orbit-1) linear infinite}.r2{width:130px;border-color:var(--ring-2);animation:spin var(--orbit-2) linear infinite reverse}.r3{width:190px;border-color:var(--ring-3);animation:spin var(--orbit-3) linear infinite}.r4{width:250px;border-width:var(--ring-width-outer);border-color:var(--ring-4);animation:spin var(--orbit-4) linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.n{position:absolute;top:-6px;width:11px;height:11px;border-radius:50%}.r1 .n{background:var(--ring-1)}.r2 .n{background:var(--ring-2)}.r3 .n{background:var(--ring-3)}.r4 .n{background:var(--ink-700);width:8px;height:8px;top:-4.5px}.p{position:absolute;width:250px;aspect-ratio:1;border-radius:50%;border:2px solid var(--olive-600);opacity:0;animation:out var(--pulse-cycle) var(--ease-expand) infinite}@keyframes out{0%{transform:scale(.26);opacity:0;border-color:var(--sage-500)}12%{opacity:.8}100%{transform:scale(1.06);opacity:0;border-color:var(--plum-500)}}@media(prefers-reduced-motion:reduce){.r,.p{animation:none!important}.p{opacity:.3}}</style></head><body><div class="stage"><span class="p"></span><div class="r r4"><span class="n"></span></div><div class="r r3"><span class="n"></span></div><div class="r r2"><span class="n"></span></div><div class="r r1"><span class="n"></span></div></div></body></html>
