<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:150px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:flex;align-items:flex-end;gap:8px}.row>div{text-align:center}.bar{background:var(--olive-600);width:26px;border-radius:1px}.k{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--text-muted);margin-top:6px}.v{font-size:10px;color:var(--text-strong)}</style></head><body><div class="row"><div><div class="bar" style="height:2px"></div><div class="v">2</div></div><div><div class="bar" style="height:4px"></div><div class="v">4</div></div><div><div class="bar" style="height:8px"></div><div class="v">8</div></div><div><div class="bar" style="height:12px"></div><div class="v">12</div></div><div><div class="bar" style="height:13px"></div><div class="v">13</div></div><div><div class="bar" style="height:14px"></div><div class="v">14</div></div><div><div class="bar" style="height:16px"></div><div class="v">16</div></div><div><div class="bar" style="height:20px"></div><div class="v">20</div></div><div><div class="bar" style="height:24px"></div><div class="v">24</div></div><div><div class="bar" style="height:32px"></div><div class="v">32</div></div><div><div class="bar" style="height:40px"></div><div class="v">40</div></div><div><div class="bar" style="height:56px"></div><div class="v">56</div></div><div><div class="bar" style="height:72px"></div><div class="v">72</div></div></div><div class="mono" style="margin-top:8px">--space-1 … --space-14 · px values, not rem</div></body></html>
