<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:160px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}h1{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:var(--tracking-display);color:var(--text-strong)}h1 em{font-style:italic;color:var(--text-reflective)}.b{margin-top:10px;font-size:15px;line-height:1.6;color:var(--text-body);max-width:46ch}.w{font-family:var(--font-display);font-size:16px;letter-spacing:var(--tracking-wordmark);text-transform:uppercase;color:var(--text-accent);margin-bottom:10px}</style></head><body><div class="w">Морана</div><h1>Всяка пролет започва със <em>зима</em>.</h1><p class="b">Учим хора и екипи как учат - и им помагаме да се откажат от методите, които тихо са спрели да работят.</p></body></html>
