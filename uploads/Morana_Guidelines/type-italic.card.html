<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:140px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.h{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:var(--tracking-title);color:var(--text-strong)}.h em{font-style:italic;color:var(--text-reflective)}.h+.h{margin-top:10px;opacity:.5}.x{color:var(--state-critical);font-size:11px;margin-top:8px}</style></head><body><div class="h">Learning is a skill you can <em>unlearn</em>.</div><div class="h">Learning <em>is</em> a <em>skill</em> you can <em>unlearn</em>.</div><div class="x">✗ more than one italic word per line</div></body></html>
