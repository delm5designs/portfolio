<!-- @dsCard group="Shape" viewport="700x150" name="Borders and elevation" subtitle="Depth comes from hairlines and cream tint shifts. Shadows are near-invisible by design." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:150px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c{background:var(--surface-card);border-radius:var(--radius-sm);padding:12px;height:78px;font-size:11.5px;color:var(--text-muted)}.c b{display:block;color:var(--text-strong);font-size:13px;font-weight:500;margin-bottom:4px}.a{box-shadow:inset 0 0 0 1px var(--border-subtle)}.b2{box-shadow:var(--shadow-card),inset 0 0 0 1px var(--border-subtle)}.c3{box-shadow:var(--shadow-raised)}</style></head><body><div class="row"><div class="c a"><b>Hairline</b>--rule · default card</div><div class="c b2"><b>Card</b>--shadow-card</div><div class="c c3"><b>Raised</b>--shadow-raised · dialogs only</div></div></body></html>
