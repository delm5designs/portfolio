<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces" subtitle="Four grounds only. Never stack more than two on one screen." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:150px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{height:74px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;font-size:11px}.t{margin-top:7px;font-size:11px;color:var(--text-strong)}.m{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style></head><body><div class="row"><div><div class="box" style="background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="t">page</div><div class="m">--surface-page</div></div><div><div class="box" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="t">card</div><div class="m">--surface-card</div></div><div><div class="box" style="background:var(--surface-sunken)"></div><div class="t">sunken</div><div class="m">--surface-sunken</div></div><div><div class="box" style="background:var(--surface-inverse)"></div><div class="t">inverse</div><div class="m">--surface-inverse</div></div></div></body></html>
