<!-- @dsCard group="Colors" viewport="700x150" name="Text roles" subtitle="Body is never pure black; the accent green is reserved for labels and links." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:150px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}.i{display:flex;align-items:baseline;gap:10px;padding:5px 0}.i b{font-weight:500;font-size:14px}.i span{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}.dark{background:var(--surface-inverse);padding:8px 10px;border-radius:var(--radius-sm)}</style></head><body><div class="g"><div class="i"><b style="color:var(--text-strong)">Strong headline ink</b><span>--text-strong</span></div><div class="i"><b style="color:var(--text-body)">Body copy</b><span>--text-body</span></div><div class="i"><b style="color:var(--text-muted)">Muted meta</b><span>--text-muted</span></div><div class="i"><b style="color:var(--text-accent)">Accent label</b><span>--text-accent</span></div><div class="i"><b style="color:var(--text-reflective)">Reflective accent</b><span>--text-reflective</span></div><div class="i dark"><b style="color:var(--text-on-dark)">On dark</b><span style="color:var(--text-on-dark-muted)">--text-on-dark</span></div></div></body></html>
