<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:160px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:flex;gap:28px;align-items:center}.g{position:relative;width:64px;height:64px;display:grid;place-items:center}.g i{position:absolute;border-radius:50%;aspect-ratio:1;border:2px solid var(--ring-idle)}.g i:nth-child(1){width:34%}.g i:nth-child(2){width:66%}.g i:nth-child(3){width:100%}.done{border-color:var(--ring-done)!important}.k{font-size:11px;color:var(--text-strong);margin-top:8px;text-align:center}.s{font-size:10.5px;color:var(--text-muted);text-align:center}</style></head><body><div class="row"><div><div class="g"><i class="done"></i><i></i><i></i></div><div class="k">Audit</div><div class="s">1 of 3</div></div><div><div class="g"><i class="done"></i><i class="done"></i><i></i></div><div class="k">Unlearn</div><div class="s">2 of 3</div></div><div><div class="g"><i class="done"></i><i class="done"></i><i class="done"></i></div><div class="k">Rebuild</div><div class="s">complete</div></div></div></body></html>
