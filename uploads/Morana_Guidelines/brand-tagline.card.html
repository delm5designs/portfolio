<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:200px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.stage{position:relative;height:160px;display:grid;place-items:center;overflow:hidden}.f{position:absolute;inset:0;display:grid;place-items:center}.r{position:absolute;border-radius:50%;border:2px solid;aspect-ratio:1}.r1{width:110px;border-color:var(--ring-1)}.r2{width:200px;border-color:var(--ring-2)}.r3{width:290px;border-color:var(--ring-3)}.r4{width:380px;border-width:1.5px;border-color:var(--ring-4)}.c{position:relative;text-align:center;background:var(--aperture);padding:28px 56px}.e{font-size:var(--text-2xs);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-accent);margin-bottom:12px}h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.02;letter-spacing:var(--tracking-display);color:var(--text-strong);max-width:14ch;margin:0 auto}h1 em{font-style:italic;color:var(--text-reflective)}</style></head><body><div class="stage"><div class="f"><span class="r r4"></span><span class="r r3"></span><span class="r r2"></span><span class="r r1"></span></div><div class="c"><div class="e">Metalearning consultancy</div><h1>Every spring starts with a <em>winter</em>.</h1></div></div></body></html>
