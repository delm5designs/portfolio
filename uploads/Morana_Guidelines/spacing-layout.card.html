<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:160px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px;display:flex;gap:10px}.g{background:var(--accent-quiet);width:34px;border-radius:1px}.c{flex:1;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-subtle);padding:10px;border-radius:var(--radius-sm)}.m{height:8px;background:var(--olive-600);border-radius:1px;opacity:.85}.m2{height:8px;background:var(--plum-500);border-radius:1px;margin-top:6px;width:62%}.k{font-size:10.5px;color:var(--text-muted);margin-top:7px}</style></head><body><div class="wrap"><div class="g"></div><div class="c"><div class="m"></div><div class="m2"></div><div class="k">--container-max 1140px · --measure-body 42ch · --measure-hero 14ch</div></div><div class="g"></div></div><div class="mono" style="margin-top:8px">--gutter-page 5vw · --section-y 96px</div></body></html>
