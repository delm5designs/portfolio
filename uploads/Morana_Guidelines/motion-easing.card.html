<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:170px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.t{position:relative;height:40px;background:var(--surface-sunken);border-radius:var(--radius-sm);overflow:hidden}.t i{position:absolute;top:50%;translate:0 -50%;left:6px;width:14px;height:14px;border-radius:50%;background:var(--olive-600)}.t.a i{animation:m 2.6s cubic-bezier(.2,.8,.2,1) infinite}.t.b i{animation:m 2.6s cubic-bezier(.22,.7,.3,1) infinite;background:var(--sage-500)}.t.c i{animation:m 2.6s cubic-bezier(.4,0,.2,1) infinite;background:var(--plum-500)}.t.d i{animation:m 2.6s cubic-bezier(.45,.05,.55,.95) infinite;background:var(--ink-700)}@keyframes m{0%{left:6px}50%{left:calc(100% - 20px)}100%{left:6px}}.k{font-size:10.5px;color:var(--text-strong);margin-top:6px}.h{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--text-muted)}@media(prefers-reduced-motion:reduce){.t i{animation:none!important}}</style></head><body><div class="row"><div><div class="t a"><i></i></div><div class="k">--ease-brand</div><div class="h">entrances</div></div><div><div class="t b"><i></i></div><div class="k">--ease-expand</div><div class="h">ring pulse</div></div><div><div class="t c"><i></i></div><div class="k">--ease-standard</div><div class="h">UI states</div></div><div><div class="t d"><i></i></div><div class="k">--ease-breathe</div><div class="h">loops</div></div></div></body></html>
