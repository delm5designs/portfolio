<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:140px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.row{display:flex;gap:14px;align-items:center}.b{width:76px;height:56px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-strong)}.p{width:96px;height:34px;border-radius:var(--radius-pill);background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-strong);display:grid;place-items:center;font-size:12px;letter-spacing:.04em}.c{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ring-2)}.k{font-size:10.5px;color:var(--text-muted);margin-top:6px}</style></head><body><div class="row"><div><div class="b" style="border-radius:var(--radius-xs)"></div><div class="k">2px - default</div></div><div><div class="b" style="border-radius:var(--radius-md)"></div><div class="k">3px - inputs</div></div><div><div class="p">EN / BG</div><div class="k">pill - toggle only</div></div><div><div class="c"></div><div class="k">circle - ring motif</div></div></div></body></html>
