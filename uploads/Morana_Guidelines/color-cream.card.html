<!-- @dsCard group="Colors" viewport="700x140" name="Cream ground" subtitle="The brand ground: page, cards, and inverse type. --cream-400 is the source palette hue." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:16px 20px;height:140px;overflow:hidden}.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.ramp{display:flex;gap:10px}.ramp>div{flex:1}.sw{height:62px;border-radius:var(--radius-sm)}.n{margin-top:7px;font-size:11px;color:var(--text-strong)}.h{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--text-muted)}</style></head><body><div class="ramp"><div><div class="sw" style="background:var(--cream-100);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">cream-100</div><div class="h">#fdfbf4</div></div><div><div class="sw" style="background:var(--cream-200);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">cream-200</div><div class="h">#fbf7ea</div></div><div><div class="sw" style="background:var(--cream-300);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">cream-300</div><div class="h">#f4edd6</div></div><div><div class="sw" style="background:var(--cream-400);"></div><div class="n">cream-400</div><div class="h">#efe3a9</div></div><div><div class="sw" style="background:var(--cream-500);"></div><div class="n">cream-500</div><div class="h">#ddcd8a</div></div></div></body></html>
